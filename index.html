<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Jaimi's Life Hub</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Life Hub" />
<meta name="theme-color" content="#F7F3EC" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icons/icon-180.png" />
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#F7F3EC; --card:#FFFFFF; --ink:#2B2722; --ink-soft:#6B655C; --ink-faint:#A39C90;
    --line:#E7E0D4; --coral:#E8927C; --mint:#7FB79B; --sunshine:#E6B855;
    --rail-w:236px; --tabbar-h:66px;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}

  /* ---- where am I + back (one slim bar above every section) ---- */
  :root{--crumb-h:42px}
  .crumb{position:fixed;z-index:15;top:0;left:0;right:0;height:calc(var(--crumb-h) + var(--sat));padding:var(--sat) 10px 0;display:flex;align-items:center;gap:8px;background:var(--paper);border-bottom:1px solid var(--line)}
  .crumb-back{display:inline-flex;align-items:center;gap:4px;max-width:55%;height:32px;padding:0 12px 0 8px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:700 13px 'Hanken Grotesk',system-ui,sans-serif;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumb-back[hidden]{display:none}
  .crumb-back b{font-size:17px;line-height:1;margin-right:2px}
  .crumb-here{flex:1;min-width:0;font:600 15px 'Fraunces',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .crumb-back:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
  .crumb-back,.crumb-life{min-height:32px!important;max-height:32px;margin:0;box-shadow:none;line-height:1}
  .crumb-life{display:none;align-items:center;gap:4px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:700 13px 'Hanken Grotesk',system-ui,sans-serif;cursor:pointer;white-space:nowrap}
  /* Finance has its own tab bar at the bottom; on a phone, two bars would stack, so Life Hub's steps aside
     there and the top bar carries the way out (‹ Back, and 🏡 Life for every other section). */
  @media (max-width:759px){
    body.in-finance .mobile-bar{display:none!important}
    body.in-finance .stage{bottom:0}
    body.in-finance .crumb-life{display:inline-flex}
  }
  .crumb-find{display:inline-flex;align-items:center;justify-content:center;width:36px;height:32px;min-height:32px!important;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:15px;cursor:pointer;margin:0;padding:0}
  .findpanel{position:fixed;z-index:31;top:calc(var(--crumb-h) + var(--sat) + 6px);left:10px;right:10px;max-width:520px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(43,39,34,.18);padding:12px;max-height:70vh;overflow:auto}
  .findpanel input{width:100%;height:48px;border:2px solid var(--line);border-radius:14px;padding:0 14px;font:600 16px inherit;font-family:inherit;background:var(--paper);color:var(--ink);outline:none}
  .findpanel input:focus{border-color:var(--coral)}
  .findres{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:10px 6px;border-top:1px solid var(--line-soft,#EEE9DF);font-family:inherit;color:var(--ink);cursor:pointer;border-radius:10px}
  .findres:first-of-type{border-top:0;margin-top:8px}.findres b{font-size:15px;overflow-wrap:anywhere;display:block}.findres small{color:var(--ink-faint);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .findres i{font-style:normal;font-size:20px;text-align:center}.findres em{font:800 10.5px system-ui,sans-serif;font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
  .findnone{padding:14px 6px 4px;color:var(--ink-faint);font-weight:700;font-size:14px;text-align:center}
  @media (min-width:760px){ .findpanel{left:calc(var(--rail-w) + 14px);right:14px;margin-left:0} }
  /* ---- always-on strip: shortcuts, and the pages inside a group ---- */
  .crumb{height:calc(42px + var(--sat))}
  .crumb-quick{display:flex;gap:4px;flex:0 0 auto}
  .crumb-quick button{display:inline-flex;align-items:center;justify-content:center;gap:5px;width:36px;height:32px;min-height:32px!important;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:15px;line-height:1;cursor:pointer;margin:0;padding:0;font-family:inherit;color:var(--ink)}
  .crumb-quick button span{display:none;font:700 12.5px 'Hanken Grotesk',system-ui,sans-serif}
  .crumb-quick button.on{background:rgba(232,146,124,.18);border-color:var(--coral)}
  .crumb-quick button:focus-visible,.crumb-sub button:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
  @media (min-width:1080px){ .crumb-quick button{width:auto;padding:0 11px} .crumb-quick button span{display:inline} }
  @media (max-width:479px){ .crumb-back span{display:none} .crumb-back{padding:0 11px 0 9px} }
  .crumb-sub{position:fixed;z-index:15;top:calc(42px + var(--sat));left:0;right:0;height:42px;display:none;align-items:center;gap:6px;padding:0 10px;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  body.has-sub{--crumb-h:84px}
  body.has-sub .crumb-sub{display:flex}
  .crumb-sub button{flex:0 0 auto;height:32px;min-height:32px!important;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:0 14px;font:700 13px 'Hanken Grotesk',system-ui,sans-serif;color:var(--ink-soft);cursor:pointer;margin:0;white-space:nowrap}
  .crumb-sub button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  @media (min-width:760px){ .crumb-sub{left:var(--rail-w)} }
  nav .navsub{display:none!important}
  .nav-me{display:contents}
  .nav-me[hidden]{display:none}
  @media (min-width:760px){
    nav button.nav-fold{padding:8px 10px 2px;margin-top:7px;color:var(--ink-faint);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;justify-content:space-between;gap:6px}
    nav button.nav-fold b{font-size:13px;transition:transform .15s}
    nav button.nav-fold[aria-expanded="true"] b{transform:rotate(90deg)}
  }
  /* ---- frames ---- */
  .stage{position:fixed;top:calc(var(--crumb-h) + var(--sat));right:0;bottom:calc(var(--tabbar-h) + var(--sab));left:0;background:var(--paper)}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--paper)}
  .stage iframe.active{display:block}
  .stage iframe#f-quest{background:#0b0716}

  /* ---- phone: bottom tab bar ---- */
  nav{
    position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabbar-h) + var(--sab));
    padding:6px 10px calc(6px + var(--sab));
    background:rgba(252,250,245,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);display:flex;gap:6px;z-index:10;
  }
  nav button, nav .finance-link{
    flex:1;border:0;background:transparent;font-family:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border-radius:14px;color:var(--ink-faint);font-size:10.5px;font-weight:700;letter-spacing:.04em;
    transition:all .15s;padding:4px 0;text-decoration:none;
  }
  nav button .ico, nav .finance-link .ico{font-size:21px;line-height:1;filter:grayscale(.85);opacity:.75;transition:all .15s}
  nav button:focus-visible, nav .finance-link:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
  nav button.active,nav a.active{color:var(--ink);background:rgba(232,146,124,.24);box-shadow:inset 4px 0 0 var(--coral);font-weight:800}
  nav button.active .ico{filter:none;opacity:1;transform:scale(1.08)}

  /* ---- iPad / Mac: left rail ---- */
  nav .nav-label{display:none}
  nav button.routebtn{position:relative}
  .count-badge[hidden]{display:none!important}
  .count-badge{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:#C94F7C;color:#fff;font-size:10px;font-weight:800}
  .mobile-bar{display:none}
  .park-sheet{position:fixed;z-index:40;inset:0;background:#30263D66;display:grid;place-items:center;padding:16px}
  .park-card{width:min(500px,100%);background:#fff;border:1px solid #E8DFF0;border-radius:22px;padding:22px;box-shadow:0 18px 55px #30263d33}
  .park-card h2{font:600 25px Fraunces,serif;margin:0 0 6px}
  .park-card p{color:#675D70;margin:0 0 13px}
  .park-card textarea{width:100%;min-height:110px;border:1px solid #D9C9FA;border-radius:12px;padding:12px;font:inherit}
  .park-card .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
  .park-card button{border:0;border-radius:12px;padding:12px 16px;min-height:44px;font-weight:800}
  .park-card .submit{background:#C94F7C;color:#fff}
  .park-card .cancel{background:#EEE7FF;color:#30263D}
  .park-card .park-choices{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .park-card .park-choices button{background:#fff;border:1px solid #E8DFF0}
  .park-card .park-choices button.selected{background:#30263D;color:#fff}
  @media (min-width:760px){
    .stage{top:calc(var(--crumb-h) + var(--sat));bottom:0;left:var(--rail-w)}
    .crumb{left:var(--rail-w)}
    nav{
      top:0;bottom:0;left:0;right:auto;width:var(--rail-w);height:auto;
      flex-direction:column;justify-content:flex-start;gap:6px;
      padding:calc(20px + var(--sat)) 14px 20px;border-top:0;border-right:1px solid var(--line);overflow-y:auto;
    }
    nav::before{
      content:"Jaimi's Life Hub";
      font-family:'Fraunces',serif;font-weight:600;font-size:19px;letter-spacing:-.01em;
      display:block;padding:6px 10px 18px;color:var(--ink);
    }
    nav button, nav .finance-link{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:11px;padding:12px 13px;font-size:14px;letter-spacing:0;border-radius:13px}
    nav button .ico, nav .finance-link .ico{font-size:19px}
    nav .spacer{flex:1}
    nav .foot{font-size:11px;color:var(--ink-faint);padding:0 10px;line-height:1.5}
    nav .nav-label{display:block;padding:8px 10px 2px;color:var(--ink-faint);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    nav .nav-label:not(:first-of-type){margin-top:7px}
    nav button, nav .finance-link{padding:9px 12px}
  }
  @media (max-width:759px){
    nav{display:none}
    .mobile-bar{position:fixed;z-index:20;display:flex;left:0;right:0;bottom:0;height:calc(var(--tabbar-h) + var(--sab));padding:5px 9px calc(5px + var(--sab));align-items:center;justify-content:space-around;gap:4px;background:rgba(252,250,245,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
    .mobile-bar button{position:relative;flex:1;min-width:0;height:52px;border:0;border-radius:13px;background:transparent;color:var(--ink-faint);font:700 10px 'Hanken Grotesk',system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
    .mobile-bar .ico{font-size:20px;line-height:1}
    .mobile-bar button.active{background:rgba(201,79,124,.13);color:#30263D}
    .mobile-bar .park-fab{flex:0 0 58px;width:58px;height:58px;margin-top:-18px;border-radius:50%;background:#C94F7C;color:#fff;font-size:25px;box-shadow:0 7px 18px rgba(201,79,124,.35)}
    .mobile-bar .park-fab span:last-child{display:none}
    .mobile-bar .count-badge{position:absolute;right:4px;top:1px}
  }

  /* ---- sync button + panel ---- */
  .syncbtn .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ink-faint);transition:background .3s}
  .syncbtn .dot.ok{background:var(--mint)}
  .syncbtn .dot.err{background:#C75B45}
  .syncbtn .dot.locked{background:var(--sunshine)}
  .syncbtn .dot.busy{background:var(--sunshine);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .syncpanel{position:fixed;z-index:30;right:12px;bottom:calc(var(--tabbar-h) + var(--sab) + 10px);left:12px;max-width:430px;margin-left:auto;
    background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(43,39,34,.18);padding:20px}
  @media (min-width:760px){ .syncpanel{left:calc(var(--rail-w) + 14px);right:auto;bottom:14px;width:410px} }
  .syncpanel h2{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin-bottom:8px}
  .syncpanel p{font-size:13px;color:var(--ink-soft);line-height:1.55;margin-bottom:10px}
  .syncpanel a{color:#2563eb;font-weight:600}
  .syncpanel input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-family:inherit;font-size:14px;background:var(--paper-2);outline:none}
  .syncpanel input:focus{border-color:var(--coral);box-shadow:0 0 0 3px rgba(232,146,124,.14)}
  .syncpanel .row{display:flex;gap:8px;margin-top:10px}
  .syncpanel .row button{flex:1;border:0;border-radius:11px;padding:11px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
  .syncpanel .primary{background:var(--ink);color:#fff}
  .syncpanel .soft{background:var(--line-soft);color:var(--ink)}
  .syncpanel .msg{font-size:12.5px;font-weight:600;margin-top:10px;min-height:16px}
  .syncpanel .msg.bad{color:#C75B45}
  .syncpanel .msg.good{color:#5E9277}

  /* ---- More menu (phone only; iPad/Mac rail shows every section) ---- */
  .morebtn{display:none}
  @media (max-width:759px){ nav button.sec{display:none} .morebtn{display:flex} }
  .morepanel{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(var(--tabbar-h) + var(--sab) + 10px);max-height:calc(100vh - var(--tabbar-h) - var(--sab) - 24px);overflow:auto;
    background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(43,39,34,.18);padding:10px}
  .morepanel h2{font-family:'Fraunces',serif;font-size:14px;font-weight:600;color:var(--ink-faint);margin:6px 10px 6px;text-transform:uppercase;letter-spacing:.06em}
  .morepanel button{display:flex;align-items:center;gap:13px;width:100%;border:0;background:transparent;font-family:inherit;
    font-size:15.5px;font-weight:600;color:var(--ink);padding:13px 12px;border-radius:13px;cursor:pointer;text-align:left}
  .morepanel button .ico{font-size:20px}
  .morepanel button:active{background:var(--line-soft)}
  .morepanel button.on{background:rgba(232,146,124,.13)}
  /* Life panel: big tiles in groups (phone) */
  .morepanel .life-head{font-family:'Fraunces',serif;font-weight:600;font-size:22px;padding:6px 10px 2px}
  .morepanel .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 4px 6px}
  .morepanel .tiles button.tile{flex-direction:column;justify-content:center;gap:4px;min-height:84px;padding:10px 4px;border:1px solid var(--line);background:var(--paper-2,#fff);border-radius:16px;font-size:13px;text-align:center}
  .morepanel .tiles button.tile .ico{font-size:26px}
  .morepanel .oldbtn{justify-content:center;border:1px dashed var(--line)!important;margin:6px 0;font-size:14px!important}
  .morepanel .oldnote{font-size:12px;color:var(--ink-faint);margin:2px 10px 8px;line-height:1.45}
  .morepanel .life-foot{display:flex;gap:6px;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
  .morepanel .life-foot button{justify-content:center;font-size:14px}
</style>
<link rel="stylesheet" href="./theme-jaimi.css" />
</head>
<body>
  <div class="crumb" id="crumb" role="navigation" aria-label="Where you are">
    <button id="crumbBack" class="crumb-back" type="button" onclick="navBack()" hidden><b aria-hidden="true">‹</b><span id="crumbBackLabel">Back</span></button>
    <span id="crumbHere" class="crumb-here" aria-live="polite"></span>
    <div class="crumb-quick" id="crumbQuick" aria-label="Shortcuts">
      <button type="button" data-q="overview" onclick="show('overview')" aria-label="Overview" title="Overview">📊<span>Overview</span></button>
      <button type="button" data-q="cp:today" onclick="showCopilot('today')" aria-label="Today" title="Today">☀️<span>Today</span></button>
      <button type="button" data-q="plan" onclick="show('plan')" aria-label="Planner" title="Planner">🗓️<span>Planner</span></button>
      <button type="button" data-q="tasks" onclick="show('tasks')" aria-label="Tasks" title="Tasks">✅<span>Tasks</span></button>
      <button type="button" data-q="finance" onclick="show('finance')" aria-label="Finance" title="Finance">💰<span>Finance</span></button>
    </div>
    <button id="crumbFind" class="crumb-find" type="button" onclick="toggleFind()" aria-label="Search everything" aria-expanded="false">🔍</button>
    <button id="crumbLife" class="crumb-life" type="button" onclick="toggleMore()" aria-label="All Life Hub sections"><span aria-hidden="true">🏡</span>Life</button>
  </div>
  <div class="crumb-sub" id="crumbSub" aria-label="Pages in this group"></div>
  <div class="findpanel" id="findPanel" hidden role="search"><input id="findInput" type="search" placeholder="🔍 Search everything" aria-label="Search tasks, planner, notes, Life Admin and inbox" oninput="runFind()" autocomplete="off"><div id="findOut"></div></div>
  <div class="stage">
    <iframe id="f-copilot" title="Co-Pilot"></iframe>
    <iframe id="f-finance" title="My Finance"></iframe>
    <iframe id="f-hub" title="Life Hub"></iframe>
    <iframe id="f-quest" title="Night Court Questkeeper"></iframe>
    <iframe id="f-course" title="Brain — mental health"></iframe>
    <iframe id="f-kitchen" title="Kitchen"></iframe>
    <iframe id="f-recipes" title="Recipes"></iframe>
    <iframe id="f-home" title="Home"></iframe>
    <iframe id="f-admin" title="Life Admin"></iframe>
    <iframe id="f-plan" title="My Planner"></iframe>
    <iframe id="f-tasks" title="Task Engine"></iframe>
    <iframe id="f-reading" title="Book Journal"></iframe>
    <iframe id="f-beauty" title="Beauty & Self-care"></iframe>
    <iframe id="f-kids" title="Kids"></iframe>
    <iframe id="f-wardrobe" title="Wardrobe"></iframe>
    <iframe id="f-family" title="Family"></iframe>
    <iframe id="f-overview" title="Overview"></iframe>
    <iframe id="f-board" title="Family board"></iframe>
    <iframe id="f-plants" title="Plants"></iframe>
    <iframe id="f-wish" title="Wishlist"></iframe>
    <iframe id="f-brain" title="Brain: journal and toolbox"></iframe>
    <iframe id="f-health" title="Health"></iframe>
  </div>

  <nav aria-label="Life Hub sections">
    <button id="b-overview" onclick="show('overview')"><span class="ico">📊</span><span>Overview</span></button>
    <span class="nav-label">My day</span>
    <button class="routebtn" onclick="showCopilot('today')"><span class="ico">☀️</span><span>Today</span></button>
    <button id="b-copilot" class="routebtn" onclick="showCopilot('now')"><span class="ico">🎯</span><span>Now</span></button>
    <button class="routebtn" onclick="showCopilot('inbox')"><span class="ico">📥</span><span>Inbox</span><span class="count-badge" data-inbox-count hidden>0</span></button>
    <span class="nav-label">Plan</span>
    <button id="b-plan" onclick="show('plan')"><span class="ico">🗓️</span><span>Planner</span></button>
    <button class="routebtn navsub" onclick="showCopilot('guides')"><span class="ico">🧭</span><span>Plan guides</span></button>
    <button id="b-tasks" onclick="show('tasks')"><span class="ico">✅</span><span>Tasks</span></button>
    <span class="nav-label">Home &amp; family</span>
    <button id="b-family" class="sec" onclick="show('family')"><span class="ico">👨‍👩‍👧‍👦</span><span>Family</span></button>
    <button id="b-kids" class="sec navsub" onclick="show('kids')"><span class="ico">🧒</span><span>Kids</span></button>
    <a id="b-board" class="finance-link navsub" href="./board/" onclick="show('board');return false"><span class="ico" aria-hidden="true">🖥️</span><span>Family board</span></a>
    <button id="b-kitchen" class="sec" onclick="show('kitchen')"><span class="ico">🍳</span><span>Food</span></button>
    <button id="b-recipes" class="sec navsub" onclick="show('recipes')"><span class="ico">📖</span><span>Recipes</span></button>

<script>
  const SRC = { copilot:'./copilot/index.html', hub:'./hub/index.html', quest:'./quest/index.html', course:'./course/index.html', kitchen:'./kitchen/index.html', recipes:'./recipes/index.html', home:'./home/index.html', admin:'./admin/index.html', plan:'./plan/index.html', tasks:'./task-engine/index.html', reading:'./reading/index.html', beauty:'./beauty/index.html', kids:'./kids/index.html', wardrobe:'./wardrobe/index.html', family:'./family/index.html', finance:'./finance/index.html', overview:'./overview/index.html', board:'./board/index.html', plants:'./plants/index.html', wish:'./wish/index.html', brain:'./brain/index.html', health:'./health/index.html' };
  const BUTTONS = { copilot:'b-copilot' };
  const MOBILE_SECTIONS = new Set(['hub','plan','tasks','course','quest','kitchen','recipes','home','admin','reading','beauty','kids','wardrobe','family','finance','overview','board','plants','wish','brain','health']);

  /* ---- Where am I, and Back ----
     Every section change is one step in the browser's history, so the phone's back gesture, the browser's back
     button and the ‹ Back button at the top all go to the place you were before, and say its name. */
  const PLACE_NAMES = {
    'cp:today':'☀️ Today','cp:now':'🎯 Now','cp:inbox':'📥 Inbox','cp:guides':'🧭 Plan guides','cp:shutdown':'🌙 Shutdown',
    'cp:ideas':'💡 Idea Vault','cp:etsy':'🛍️ Etsy Studio','cp:notes':'🗒️ Notes','cp:settings':'⚙️ Settings',
    plants:'🪴 Plants',wish:'🛍️ Wishlist',brain:'🧠 Brain',health:'❤️ Health',overview:'📊 Overview',board:'🖥️ Family board',hub:'🎛️ Command Centre',plan:'🗓️ My Planner',tasks:'✅ Tasks',kitchen:'🍳 Kitchen',recipes:'📖 Recipes',home:'🏠 Old Home page',admin:'📋 Life Admin',
    kids:'🧒 Kids',family:'👨‍👩‍👧‍👦 Family',course:'🎓 Brain course',quest:'🌙 Quests',reading:'📚 Books',beauty:'💄 Beauty',wardrobe:'👗 Wardrobe',finance:'💰 Finance'
  };
  /* Pages that belong together: the menu shows one door, and the strip shows the pages inside it. */
  const NAV_GROUPS = [['plan','cp:guides','home'], ['family','kids','board'], ['kitchen','recipes'], ['brain','course']];
  const NAV_ME = new Set(['hub','quest','reading','beauty','wardrobe','cp:ideas','cp:etsy','cp:notes']);
  /* Light up the menu button for the page you are on. Today, Inbox and the other Co-Pilot pages each get their own light, not all "Now". */
  function navLight(key){
    try {
      document.querySelectorAll('nav .routebtn').forEach(b => { const m = (b.getAttribute('onclick') || '').match(/showCopilot\('([^']+)'\)/); if (m) b.classList.toggle('active', key === 'cp:' + m[1]); });
      NAV_GROUPS.forEach(g => { const door = document.getElementById('b-' + g[0]); if (door) door.classList.toggle('active', g.includes(key)); });
      if (NAV_ME.has(key)) navMeSet(true);
      const care = document.getElementById('b-homecare'), plan = document.getElementById('b-plan'); // Home care is a page of the Planner with its own door
      if (care) { const on = key === 'plan' && homeCareOn; care.classList.toggle('active', on); if (on && plan) plan.classList.remove('active'); }
    } catch(e){}
  }
  function navOpen(k){ if (String(k).startsWith('cp:')) showCopilot(k.slice(3)); else show(k); }
  function navMeSet(open){ try { const box = document.getElementById('navMe'), b = document.getElementById('navMeBtn'); box.hidden = !open; b.setAttribute('aria-expanded', String(!!open)); } catch(e){} }
  function navMeToggle(){ const open = document.getElementById('navMe').hidden; navMeSet(open); try { localStorage.setItem('lifehub_nav_me', open ? '1' : ''); } catch(e){} }
  /* Jump straight to a Planner day or a Life Admin item, from Search, the Overview or the other section. */
  function goPlanDate(iso){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(iso || ''))) return show('plan');
    try { sessionStorage.setItem('plan_goto', iso); } catch(e){}
    show('plan');
    try { const w = document.getElementById('f-plan').contentWindow; if (w && w.ppGoto) w.ppGoto(iso); } catch(e){}
  }
  /* Home care lives in the Planner (its Home tab). This door opens it there and keeps its own menu light on. */
  let homeCareOn = false;
  function goHomeCare(){
    try { sessionStorage.setItem('plan_goto_lists', '1'); } catch(e){}
    show('plan'); homeCareOn = true; navLight('plan');
    try { const w = document.getElementById('f-plan').contentWindow; if (w && w.ppLists) w.ppLists(); } catch(e){}
  }
  function goAdminItem(id){
    try { sessionStorage.setItem('la_open', String(id)); } catch(e){}
    show('admin');
    try { const w = document.getElementById('f-admin').contentWindow; if (w && w.lpOpen) w.lpOpen(String(id)); } catch(e){}
  }
  let navCurrent = null, navSilent = false;
  const placeKey = p => p ? (p.cp ? 'cp:'+p.cp : p.sec) : '';
  const placeName = p => PLACE_NAMES[placeKey(p)] || (p && p.cp ? '🎯 Co-Pilot' : '🏡 Life Hub');
  function navPaint(back){
    if (back === undefined){ try { back = window.history && window.history.state ? window.history.state.back : null; } catch(e){ back = null; } }
    const here = document.getElementById('crumbHere'), b = document.getElementById('crumbBack'), label = document.getElementById('crumbBackLabel');
    if (here) here.textContent = navCurrent ? placeName(navCurrent) : '';
    if (b){
      b.hidden = !back;
      if (label) label.textContent = back ? placeName(back) : 'Back';
      if (b.setAttribute) b.setAttribute('aria-label', back ? 'Back to ' + placeName(back).replace(/^\S+\s/, '') : 'Back');
    }
    try { // light up the shortcut you are on, show the pages inside this group, and keep its menu door lit
      const key = placeKey(navCurrent), group = NAV_GROUPS.find(g => g.includes(key)), sub = document.getElementById('crumbSub');
      document.querySelectorAll('#crumbQuick [data-q]').forEach(q => q.classList.toggle('on', q.dataset.q === key));
      sub.innerHTML = group ? group.map(k => '<button type="button" class="' + (k === key ? 'on' : '') + '" aria-current="' + (k === key ? 'page' : 'false') + '" onclick="navOpen(\'' + k + '\')">' + PLACE_NAMES[k] + '</button>').join('') : '';
      document.body.classList.toggle('has-sub', !!group);
      navLight(key);
    } catch(e){}
  }
  function navRecord(p){
    if (navSilent) return;
    const h = window.history;
    if (!navCurrent){ navCurrent = p; try { h && h.replaceState({ lh:p, back:null }, ''); } catch(e){} navPaint(null); return; }
    if (placeKey(p) === placeKey(navCurrent)){ navPaint(); return; }
    const back = navCurrent; navCurrent = p;
    try { h && h.pushState({ lh:p, back }, ''); } catch(e){}
    navPaint(back);
  }
  function navGo(p){
    navSilent = true;
    try { if (p.cp) showCopilot(p.cp); else show(p.sec); } finally { navSilent = false; }
    navCurrent = p; navPaint();
  }
  function navBack(){
    try { if (window.history.state && window.history.state.back) { window.history.back(); return; } } catch(e){}
  }
  window.addEventListener('popstate', e => { const s = e.state; if (s && s.lh) navGo(s.lh); });

  /* ---- Search everything: planner blocks, tasks, notes, Life Admin and the Inbox, straight from this device ---- */
  let findCore = null, findHits = [];
  const findRead = (key, pick) => { try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return pick(v) || []; } catch(e){ return []; } };
  function toggleFind(){
    const p = document.getElementById('findPanel'), b = document.getElementById('crumbFind'); p.hidden = !p.hidden;
    if (b && b.setAttribute) b.setAttribute('aria-expanded', String(!p.hidden));
    if (!p.hidden){ const i = document.getElementById('findInput'); i.value = ''; document.getElementById('findOut').innerHTML = ''; setTimeout(() => i.focus(), 30);
      if (!findCore) import('./plan/core.mjs').then(m => { findCore = m; runFind(); }).catch(() => {}); }
  }
  function runFind(){
    const q = document.getElementById('findInput').value, out = document.getElementById('findOut'); if (!findCore || !out) return;
    const asList = v => Array.isArray(v) ? v : null;
    findHits = findCore.search(q, {
      blocks: findRead('plan_blocks', asList), tasks: findRead('hq_task_engine_v1', v => v && asList(v.tasks)), notes: findRead('cp_notes_v1', v => v && asList(v.notes)),
      admin: findRead('la_items', v => asList(v) || (v && asList(v.items))), inbox: findRead('cp_inbox_v1', asList) });
    const safe = t => String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    out.innerHTML = findHits.map((r, i) => '<button type="button" class="findres" onclick="openFind(' + i + ')"><i aria-hidden="true">' + safe(r.icon) + '</i><span><b>' + safe(r.title) + '</b><small>' + safe(r.sub) + '</small></span><em>' + safe(r.kind) + '</em></button>').join('')
      || (q.trim() ? '<div class="findnone">Nothing found</div>' : '');
  }
  function openFind(i){
    const r = findHits[i]; if (!r) return; document.getElementById('findPanel').hidden = true;
    if (r.go.cp) return showCopilot(r.go.cp);
    if (r.go.sec === 'plan' && r.go.date) return goPlanDate(r.go.date); // a dated planner block opens on its day
    if (r.go.sec === 'admin' && r.go.item) return goAdminItem(r.go.item); // a Life Admin hit opens the item itself
    show(r.go.sec);
  }
  /* ---- Finance inside Life Hub ----
     Finance shares this page's one encrypted store and sync (bulk-storage.js and sync.js below), so there is only
     ever one copy of your money data running. The bank feed scripts load the first time Finance is opened. */
  let financeFeedLoaded = false;
  function loadFinanceFeed(){
    if (financeFeedLoaded) return; financeFeedLoaded = true;
    try {
      const add = src => new Promise(done => { try { const s = document.createElement('script'); s.src = src; s.onload = done; s.onerror = done; document.body.appendChild(s); } catch(e){ done(); } });
      add('./finance/pocketsmith-import.js?v=20261028-unmatched').then(() => add('./finance/pocketsmith-client.js?v=20261009-mapping')).then(() => {
        // the importer waits for the Finance screen to be ready before it changes anything
        try { if (window.PocketSmithFinance && window.PocketSmithFinance.state().connected) window.PocketSmithFinance.syncNow(true).catch(() => {}); } catch(e){}
      });
    } catch(e){}
  }
  let parkFocus = null;
  let parkSelection = 'later';
  let inboxTimer = 0;
  let pendingCopilotTask = null;

  let copilotRoute='now';
  /* Remember when each section was last opened, so Life can fold away ones not used in 3 weeks. */
  const K_LAST_OPENED='lifehub_last_opened';
  function markOpened(k){ try{ const s=JSON.parse(localStorage.getItem(K_LAST_OPENED)||'{}'); s[k]=Date.now(); localStorage.setItem(K_LAST_OPENED,JSON.stringify(s)); }catch(e){} }
  function lifeFold(){
    try{
      const seen=JSON.parse(localStorage.getItem(K_LAST_OPENED)||'{}'),now=Date.now(),old=21*86400000,grid=document.getElementById('lifeOldTiles');let n=0;
      document.querySelectorAll('#morePanel [data-k]').forEach(b=>{
        const k=b.dataset.k; if(!seen[k]) seen[k]=now; // first time: count as used today, so nothing hides on day one
        if(now-seen[k]>old){ if(b.parentNode!==grid) grid.appendChild(b); n++; }
        else if(b.parentNode===grid){ document.getElementById(b.dataset.home).appendChild(b); }
      });
      localStorage.setItem(K_LAST_OPENED,JSON.stringify(seen));
      document.getElementById('lifeOld').hidden=!n; document.getElementById('lifeOldCount').textContent=n;
    }catch(e){}
  }
  function showCopilot(route='now'){
    copilotRoute=route; markOpened('cp:'+route);
    const f=document.getElementById('f-copilot');
    const silent=navSilent; navSilent=true;
    try{
      if(!f.src||!f.src.includes('/copilot/index.html')){
        f.src=SRC.copilot+'#'+encodeURIComponent(route);
        show('copilot');
        return;
      }
      show('copilot');
    }finally{ navSilent=silent; navRecord({cp:route}); }
    try{f.contentWindow.location.hash=route;}catch(e){}
    try{f.contentWindow.postMessage({type:'copilot-route',route},location.origin);}catch(e){f.contentWindow.location.hash=route;}
  }
  function show(which){
    if (!Object.prototype.hasOwnProperty.call(SRC, which)) which = 'hub';
    homeCareOn = false;
    if (which === 'finance') loadFinanceFeed();
    if (which !== 'copilot') navRecord({ sec:which }); else if (!navSilent) navRecord({ cp:copilotRoute });
    for (const k of Object.keys(SRC)){
      const f = document.getElementById('f-'+k), b = document.getElementById(BUTTONS[k]||'b-'+k);
      const on = k === which;
      if (on && !f.src) f.src = SRC[k] + (k==='copilot'?'#now':''); // lazy-load each section once
      f.classList.toggle('active', on);
      if(b)b.classList.toggle('active', on);
    }
    navLight(which === 'copilot' ? 'cp:' + copilotRoute : which);
    try { localStorage.setItem('lifehub_tab', which); } catch(e){}
    try { document.body.classList.toggle('in-finance', which === 'finance'); } catch(e){}
    document.querySelector('meta[name=theme-color]').content = which === 'quest' ? '#0b0716' : '#F7F3EC';
    // on phone, highlight "More" when a tucked-away section is showing
    const inMore = MOBILE_SECTIONS.has(which);
    const mb = document.getElementById('b-more'); if (mb) mb.classList.toggle('active', inMore);
    const mobileMore = document.getElementById('b-mobile-more'); if (mobileMore) mobileMore.classList.toggle('active', inMore && which !== 'plan');
    const mobilePlan = document.getElementById('b-mobile-plan'); if (mobilePlan) mobilePlan.classList.toggle('active', which === 'plan');
    markOpened(which);
    if (which === 'overview') try { document.getElementById('f-overview').contentWindow.ovDraw(); } catch(e){}
    if (which === 'plants') try { document.getElementById('f-plants').contentWindow.plDraw(); } catch(e){}
    if (which === 'wish') try { document.getElementById('f-wish').contentWindow.wlDraw(); } catch(e){}
    if (which === 'brain') try { document.getElementById('f-brain').contentWindow.brDraw(); } catch(e){}
    if (which === 'health') try { document.getElementById('f-health').contentWindow.hlDraw(); } catch(e){}
    document.querySelectorAll('.mobile-bar [data-route]').forEach(button=>button.classList.toggle('active',which==='copilot'&&button.dataset.route===copilotRoute));
    const mp = document.getElementById('morePanel'); if (mp && !mp.hidden) mp.hidden = true;
  }
  /* ---- More menu (phone) ---- */
  function toggleMore(){
    const p = document.getElementById('morePanel');
    document.getElementById('syncPanel').hidden = true;
    p.hidden = !p.hidden;
    if (!p.hidden){ lifeFold(); const cur = localStorage.getItem('lifehub_tab');
      p.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.getAttribute('onclick')?.includes("'"+cur+"'"))); }
  }
  function showFromMore(which){ document.getElementById('morePanel').hidden = true; show(which); }
  document.addEventListener('click', (e)=>{
    const p = document.getElementById('morePanel');
    if (!p || p.hidden) return;
    if (!p.contains(e.target) && !e.target.closest('#b-more,#b-mobile-more,#crumbLife')) p.hidden = true;
  });
  document.addEventListener('click', (e)=>{ const p = document.getElementById('findPanel'); if (p && !p.hidden && !p.contains(e.target) && !e.target.closest('#crumbFind')) p.hidden = true; });
  // wait for the sync engine's first pull (or its ready signal) so sections open on fresh data
  let booted = false;
  const boot = () => {
    if (booted) return;
    booted = true;
    let saved = null;
    try { saved = localStorage.getItem('lifehub_tab'); } catch(e){}
    try { if (localStorage.getItem('lifehub_nav_me')) navMeSet(true); } catch(e){}
    // Finance is a section like any other: a saved Finance tab, or ?tab=finance, opens it here, never in a new tab.
    const query=new URLSearchParams(location.search);
    const requested=query.get('tab')==='copilot'?location.hash.slice(1)||'now':null;
    if(requested){showCopilot(requested);return;}
    if(query.get('tab')==='finance'){show('finance');return;}
    // Coming back after a break (3 hours or more): land on your day, not wherever you were. Mornings open Today, later opens Now.
    try {
      const seen = JSON.parse(localStorage.getItem(K_LAST_OPENED) || '{}'), last = Math.max(0, ...Object.values(seen).map(Number).filter(Number.isFinite));
      if (last && Date.now() - last > 3 * 3600000) { showCopilot(new Date().getHours() < 9 ? 'today' : 'now'); return; }
    } catch(e){}
    if(saved){show(saved);return;}
    showCopilot('today');
  };
  window.addEventListener('lifehub-sync-ready', boot, { once: true });
  setTimeout(boot, 7000);

  /* ---- sync panel ---- */
  function toggleSync(){
    const p = document.getElementById('syncPanel');
    p.hidden = !p.hidden;
    if (!p.hidden) renderSync();
  }
  function renderSync(){
    const s = LifeHubSync.state();
    const body = document.getElementById('syncBody');
    if (!s.on){
      body.innerHTML = `
        <p><b>Keep iPhone, iPad &amp; Mac in step.</b> Quest progress, course answers and cleaning-schedule edits sync through your own GitHub account — encrypted with your passcode before they leave the device, so GitHub only ever stores scrambled text.</p>
        <p>One-time setup on each device: <a href="https://github.com/settings/tokens/new?scopes=gist&description=Life%20Hub%20sync" target="_blank" rel="noopener">tap here to create your sync token</a> (everything's pre-filled — just press the green <b>Generate token</b> button at the bottom), copy the code it shows, and paste it below.</p>
        <input id="tokIn" type="password" placeholder="Paste token here (ghp_…)" autocomplete="off" />
        <div class="row"><button class="primary" onclick="connectSync()">Turn on sync</button></div>`;
    } else {
      const last = s.last ? new Date(s.last).toLocaleString('en-AU',{hour:'numeric',minute:'2-digit',day:'numeric',month:'short'}) : 'not yet';
      const line = s.status==='err' ? '⚠️ ' + (s.detail || 'Sync problem — will retry.') :
                   s.status==='locked' ? '🔒 Unlock the Life Hub tab once on this device, then sync can run.' :
                   s.status==='busy' ? 'Syncing…' : '✓ Sync is on. Last synced: ' + last + '.';
      body.innerHTML = `
        <p>${line}</p>
        <div class="row">
          <button class="primary" onclick="LifeHubSync.syncNow()">Sync now</button>
          <button class="soft" onclick="if(confirm('Turn sync off on this device? Nothing is deleted — this device just stops syncing.')){LifeHubSync.disconnect();renderSync();}">Turn off</button>
        </div>`;
    }
    body.innerHTML += familyPanelHtml();
    body.innerHTML += `
      <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:14px">
        <p style="margin-bottom:8px"><b>Backup everything.</b> Downloads one file with every module's data — money, kids, wardrobe, all of it. It's <b>not encrypted</b> once it's on your device, so keep it somewhere private (not a shared drive).</p>
        <div class="row">
          <button class="soft" onclick="exportBackup()">⇩ Download backup</button>
          <button class="soft" onclick="document.getElementById('importFile').click()">⇧ Restore from file</button>
        </div>
        <input id="importFile" type="file" accept=".json,application/json" hidden onchange="importBackup(this.files[0])">
      </div>`;
    document.getElementById('syncMsg').textContent = '';
  }
  /* ---- Family board sharing (family-sync.js): only the family calendar, shopping, dinners and notice board ---- */
  let familySync=null;
  function startFamilySync(){ try{ if(!window.FamilySync) return; if(!familySync) familySync=FamilySync.init({publisher:true}); if(familySync.on()&&!startFamilySync.polling){ startFamilySync.polling=true; familySync.startPolling(120000); } }catch(e){} }
  function familyPanelHtml(){
    const on=familySync&&familySync.on(), st=familySync?familySync.state():{};
    let labels=[],named=null; try{labels=JSON.parse(localStorage.getItem('board_cal_labels')||'[]');named=JSON.parse(localStorage.getItem('cp_board_named_cals')||'null');}catch(e){}
    const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const isNamed=l=>named?named.includes(l):/family|kid|school|sport|swim|footy/i.test(l);
    const cals=labels.length?`<p style="margin:10px 0 4px"><b>Show event names from:</b> (anything else shows as "Busy")</p>`+labels.map(l=>`<label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:4px 0"><input type="checkbox" style="width:auto" data-boardcal="${esc(l)}" ${isNamed(l)?'checked':''} onchange="saveBoardCals()"> ${esc(l)}</label>`).join(''):'';
    const last=st.last?new Date(st.last).toLocaleString('en-AU',{hour:'numeric',minute:'2-digit',day:'numeric',month:'short'}):'not yet';
    return `<div style="border-top:1px solid var(--line);margin-top:16px;padding-top:14px">
      <p style="margin-bottom:8px"><b>👨‍👩‍👧‍👦 Family board (kitchen iPad).</b> Shares only the family calendar, shopping list, dinners and notice board. Your money, tasks and notes never go to it.</p>
      ${on?`<p>${st.status==='err'?'⚠️ '+esc(st.detail):st.status==='busy'?'Sharing…':'✓ Sharing is on. Last shared: '+last+'.'}</p>${cals}
        <div class="row"><button class="primary" onclick="familySync.syncNow().then(renderSync)">Share now</button><a class="soft" style="flex:1;text-align:center;padding:11px;border-radius:11px;text-decoration:none;font-weight:700;font-size:13px;color:var(--ink)" href="./board/" target="_blank" rel="noopener">Open the board</a></div>
        <div class="row"><button class="soft" onclick="if(confirm('Stop sharing from this device? Nothing is deleted.')){familySync.disconnect();renderSync();}">Stop sharing here</button></div>`
      :`<p>Pick a family passcode (not your own one). You'll type the same one on the iPad.</p>
        <input id="famPass" type="password" placeholder="Family passcode" autocomplete="new-password" />
        <div class="row"><button class="primary" onclick="connectFamily()">Start sharing</button></div>`}
    </div>`;
  }
  async function connectFamily(){
    const msg=document.getElementById('syncMsg');
    if(!LifeHubSync.state().on){ msg.className='msg bad'; msg.textContent='Turn on sync above first, so the board can use your GitHub key.'; return; }
    startFamilySync();
    try{ await familySync.connect(document.getElementById('famPass').value); startFamilySync(); renderSync(); msg.className='msg good'; msg.textContent='Family board sharing is on ✓ Now open the board on the iPad.'; }
    catch(e){ msg.className='msg bad'; msg.textContent=e.message; }
  }
  function saveBoardCals(){ const picked=[...document.querySelectorAll('[data-boardcal]')].filter(x=>x.checked).map(x=>x.dataset.boardcal); try{ localStorage.setItem('cp_board_named_cals',JSON.stringify(picked)); }catch(e){} }
  async function exportBackup(){
    let data;try{data=await LifeHubSync.exportAll();}catch(error){document.getElementById('syncMsg').textContent='Backup could not be read: '+error.message;return;}
    const blob = new Blob([JSON.stringify(data, null, 1)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const d = new Date(); const stamp = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    a.download = `life-hub-backup-${stamp}.json`;
    a.click();
    const msg = document.getElementById('syncMsg');
    msg.className = 'msg good'; msg.textContent = `Downloaded — ${Object.keys(data.keys).length} keys backed up ✓`;
  }
  function importBackup(file){
    if (!file) return;
    const msg = document.getElementById('syncMsg');
    if (!confirm('Restore from this backup? Anything already saved with the same name (in any module) will be overwritten with the version in the backup.')){
      document.getElementById('importFile').value = ''; return;
    }
    const r = new FileReader();
    r.onload = async () => {
      try {
        const data = JSON.parse(r.result);
        const n = await LifeHubSync.importAll(data, 'merge');
        msg.className = 'msg good'; msg.textContent = `Restored ${n} keys ✓ — switch tabs to see the refreshed data.`;
        document.querySelectorAll('.stage iframe').forEach(f => { if (f.src) try { f.contentWindow.location.reload(); } catch(e){} });
      } catch(e){ msg.className = 'msg bad'; msg.textContent = 'Couldn’t read that file — is it a Life Hub backup?'; }
    };
    r.readAsText(file);
    document.getElementById('importFile').value = '';
  }
  async function connectSync(){
    const msg = document.getElementById('syncMsg');
    msg.className = 'msg'; msg.textContent = 'Connecting…';
    try {
      await LifeHubSync.connect(document.getElementById('tokIn').value);
      renderSync();
      msg.className = 'msg good'; msg.textContent = 'Connected — this device now syncs ✓';
    } catch(e){
      msg.className = 'msg bad'; msg.textContent = e.message;
    }
  }
  document.addEventListener('lifehub-sync-state', (e) => {
    const d = document.getElementById('syncDot');
    d.className = 'dot ' + ({ok:'ok', err:'err', busy:'busy', locked:'locked'}[e.detail.status] || '');
    const p = document.getElementById('syncPanel');
    if (!p.hidden && e.detail.status !== 'busy') renderSync();
  });

  function openPark(){
    if(document.getElementById('parkSheet'))return;
    parkFocus=document.activeElement;
    parkSelection='later';
    document.getElementById('parkRoot').innerHTML=`<div class="park-sheet" id="parkSheet"><section class="park-card" role="dialog" aria-modal="true" aria-labelledby="parkTitle"><p>Not now. It’s saved, so you won’t lose it.</p><h2 id="parkTitle">Park this thought</h2><label for="parkText">What came to mind?</label><textarea id="parkText" autofocus></textarea><div class="park-choices">${[['later','Sort later'],['home','Home task'],['work','Work task'],['idea','Idea'],['etsy','Etsy'],['note','Note']].map(([key,label])=>`<button data-park-choice="${key}" class="${key==='later'?'selected':''}" onclick="selectPark('${key}')">${label}</button>`).join('')}</div><div class="actions"><button class="cancel" onclick="closePark()">Cancel</button><button class="submit" onclick="savePark()">Park it and go back</button></div></section></div>`;
    const input=document.getElementById('parkText');input?.focus();
  }
  function selectPark(value){
    parkSelection=value;
    document.querySelectorAll('[data-park-choice]').forEach(button=>button.classList.toggle('selected',button.dataset.parkChoice===value));
  }
  function closePark(){
    document.getElementById('parkRoot').innerHTML='';
    parkFocus?.focus?.();parkFocus=null;
  }
  function recordParkReward(){
    const rewards=JSON.parse(localStorage.getItem('cp_rewards_v1')||'{}');
    const log=JSON.parse(localStorage.getItem('cp_log_v1')||'[]');
    if(!rewards||typeof rewards!=='object'||Array.isArray(rewards)||!log||!Array.isArray(log))throw new Error('Reward data is unreadable; the thought was saved without changing it.');
    const byDate=rewards.byDate??{};
    if(!byDate||typeof byDate!=='object'||Array.isArray(byDate))throw new Error('Spark history is unreadable; the thought was saved without changing it.');
    const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Brisbane',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
    const next={...rewards,total:Math.max(0,Number(rewards.total)||0)+2,byDate:{...byDate,[date]:(Number(byDate[date])||0)+2},stickers:Array.isArray(rewards.stickers)?[...new Set(rewards.stickers)]:[],unlockedThemes:Array.isArray(rewards.unlockedThemes)?[...new Set(rewards.unlockedThemes)]:[]};
    const stickerIds=['sprout','moon','star','coffee','sun','little-house','notebook','paintbrush','flower','cloud','rainbow','mug','book','leaf','sparkle','cat','pencil','heart','plant-pot','shell','lantern','butterfly','candle','mountain'];
    const milestones=[25,60,100,150];for(let value=225;value<=next.total;value+=75)milestones.push(value);
    for(const milestone of milestones){if(next.total>=milestone){const sticker=stickerIds[milestones.indexOf(milestone)%stickerIds.length];if(!next.stickers.includes(sticker))next.stickers.push(sticker);}}
    for(const [threshold,theme] of [[100,'sunrise'],[250,'lagoon'],[500,'lavender-dusk'],[1000,'night-court']])if(next.total>=threshold&&!next.unlockedThemes.includes(theme))next.unlockedThemes.push(theme);
    const cutoff=Date.now()-60*86400000;
    const entries=log.filter(entry=>entry&&new Date(entry.at).getTime()>=cutoff);
    entries.push({at:new Date().toISOString(),type:'park'});
    localStorage.setItem('cp_rewards_v1',JSON.stringify(next));
    localStorage.setItem('cp_log_v1',JSON.stringify(entries));
  }
  function savePark(){
    const input=document.getElementById('parkText'),text=input?.value.trim();
    if(!text){input?.focus();return;}
    let items;
    try{
      const raw=localStorage.getItem('cp_inbox_v1');
      items=raw===null?[]:JSON.parse(raw);
      if(!Array.isArray(items))throw new Error('Inbox data is not a list.');
      const suggested=parkSelection==='idea'?{kind:'idea',ideaCat:'someday'}:parkSelection==='note'?{kind:'note'}:parkSelection==='etsy'?{kind:'etsy',area:'etsy',tier:'important',mins:20}:parkSelection==='work'?{kind:'task',area:'work',tier:'important',mins:20}:{kind:'task',area:'home',tier:'important',mins:20};
      items.push({id:crypto.randomUUID?.()||Date.now().toString(36),text,at:new Date().toISOString(),source:'park',suggested});
      localStorage.setItem('cp_inbox_v1',JSON.stringify(items));
      try{recordParkReward();}catch(error){window.alert(error.message||'The thought was saved, but its reward could not be recorded.');}
      window.dispatchEvent(new CustomEvent('lifehub-park'));
      const copilot=document.getElementById('f-copilot');
      if(copilot?.src)copilot.contentWindow.postMessage({type:'copilot-refresh'},location.origin);
      refreshInboxBadge();
      closePark();
    }catch(error){
      const card=document.querySelector('.park-card');
      if(card&&!card.querySelector('.park-error'))card.insertAdjacentHTML('beforeend',`<p class="park-error" role="alert">${String(error.message||'Could not save this thought.').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}</p>`);
    }
  }
  function refreshInboxBadge(){
    let count=0;
    try{
      const items=JSON.parse(localStorage.getItem('cp_inbox_v1')||'[]');
      const rendered=Number(localStorage.getItem('cp_inbox_count_v1')||0);
      count=Math.max(Array.isArray(items)?items.length:0,rendered);
    }catch(e){count=0;}
    document.querySelectorAll('[data-inbox-count]').forEach(b=>{b.textContent=count>99?'99+':String(count);b.hidden=count===0;});
  }
  window.addEventListener('storage',event=>{if(!event.key||event.key.startsWith('cp_'))refreshInboxBadge();});
  window.addEventListener('message',event=>{
    if(event.origin!==location.origin)return;
    const tasks=document.getElementById('f-tasks');
    if(event.source===tasks?.contentWindow&&event.data?.type==='copilot-start-task'&&typeof event.data.taskId==='string'){
      pendingCopilotTask=event.data.taskId;
      showCopilot('now');
      const copilot=document.getElementById('f-copilot');
      if(copilot.dataset.copilotReady==='true'){
        copilot.contentWindow.postMessage({type:'copilot-start-task',taskId:pendingCopilotTask},location.origin);
        pendingCopilotTask=null;
      }
    }
    if(event.source===document.getElementById('f-copilot')?.contentWindow&&event.data?.type==='copilot-ready'){
      const copilot=document.getElementById('f-copilot');
      copilot.dataset.copilotReady='true';
      if(pendingCopilotTask){
        event.source.postMessage({type:'copilot-start-task',taskId:pendingCopilotTask},location.origin);
        pendingCopilotTask=null;
      }
    }
    if(event.source===document.getElementById('f-copilot')?.contentWindow&&event.data?.type==='copilot-mode-color'){
      document.querySelector('meta[name=theme-color]').content=event.data.color||'#F7F3EC';
    }
  });
  window.setInterval(refreshInboxBadge,60000);
  refreshInboxBadge();
  let keySequence='';
  let keyTimer=0;
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&document.getElementById('parkSheet')){closePark();return;}
    const tag=event.target?.tagName?.toLowerCase();
    if(tag==='input'||tag==='textarea'||event.target?.isContentEditable)return;
    if(event.key==='.'&&!event.metaKey&&!event.ctrlKey&&!event.altKey){event.preventDefault();openPark();return;}
    if(keySequence==='g'){
      clearTimeout(keyTimer);keySequence='';
      if(event.key==='n')showCopilot('now');
      else if(event.key==='t')showCopilot('today');
      else if(event.key==='i')showCopilot('inbox');
      return;
    }
    if(event.key==='g'){keySequence='g';keyTimer=setTimeout(()=>keySequence='',800);}
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
<script src="./finance/bulk-storage.js"></script>
<script src="./sync.js"></script>
<script src="./family-sync.js"></script>
<script>try{startFamilySync();}catch(e){}</script>
</body>
</html>

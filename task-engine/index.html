<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tasks — Life Hub</title><style>
:root{--paper:#f7f3ec;--card:#fff;--ink:#2b2722;--soft:#716a61;--line:#e7e0d4;--coral:#e8927c;--mint:#7fb79b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}.app{max-width:850px;margin:auto;padding:24px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-family:Georgia,serif;font-size:20px}.brand span{color:var(--coral)}nav{display:flex;gap:6px;background:#eee8de;padding:5px;border-radius:14px;overflow:auto}nav button{border:0;background:none;padding:9px 12px;border-radius:10px;font-weight:700;color:var(--soft);white-space:nowrap}nav button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px #0001}.hero{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 0}.hero small{font-weight:800;letter-spacing:.08em;color:var(--coral)}h1{font:600 36px Georgia,serif;margin:4px 0}h2{font:600 20px Georgia,serif;margin:26px 0 10px}h2 span{font:700 12px system-ui;background:#eee8de;border-radius:99px;padding:3px 7px}.hero p,.meta{color:var(--soft);font-size:13px}.task,.idea{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0}.task.done{opacity:.55}.task.done b{text-decoration:line-through}.grow{flex:1}.check{width:26px;height:26px;border:2px solid var(--mint);border-radius:50%;background:white;color:white}.done .check{background:var(--mint)}.more,.idea button{border:0;background:#f1ece4;border-radius:9px;padding:7px 10px}.steps{display:grid;gap:5px;margin-top:10px;font-size:13px}.empty{background:#fff8;border:1px dashed var(--line);padding:18px;border-radius:14px;color:var(--soft)}button{cursor:pointer}.primary{border:0;border-radius:12px;background:var(--ink);color:#fff;padding:11px 15px;font-weight:800}.scrim{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;justify-content:center}.scrim.show{display:flex}.sheet{background:var(--card);width:min(600px,100%);border-radius:22px 22px 0 0;padding:24px;max-height:88vh;overflow:auto}.close{float:right;border:0;background:#eee8de;border-radius:50%;width:32px;height:32px}.sheet label{display:grid;gap:6px;margin:14px 0;font-size:13px;font-weight:800}.sheet input,.sheet select{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full,.choice{width:100%;margin-top:9px}.danger{border:1px solid #c75b45;color:#c75b45;background:white;border-radius:12px;padding:11px}.choice{text-align:left;border:1px solid var(--line);background:white;border-radius:12px;padding:12px}@media(max-width:600px){.top{display:block}.brand{margin-bottom:12px}.hero{align-items:flex-start}h1{font-size:30px}}
</style></head><body><main class="app"><div class="top"><div class="brand">Life Hub <span>Tasks</span></div><nav><button data-action="nav" data-view="today">Today Plan</button><button data-action="nav" data-view="tasks">Tasks</button><button data-action="nav" data-view="contexts">By context</button><button data-action="nav" data-view="ideas">Ideas</button></nav></div><div id="root"></div></main><div id="scrim" class="scrim"><div id="sheet" class="sheet"></div></div><script type="module" src="./ui/index.mjs"></script></body></html>

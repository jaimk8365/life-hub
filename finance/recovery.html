<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance recovery</title>
<style>body{font:16px system-ui;max-width:720px;margin:40px auto;padding:0 20px;color:#30253f;background:#fcf8ff}button{font:inherit;padding:14px;border:0;border-radius:12px;background:#30253f;color:white;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:9px;border-bottom:1px solid #ddd}p{line-height:1.5}#status{font-weight:600}</style>
<h1>Finance recovery</h1><p>This page reads your saved data without importing, syncing or changing it. Keep the original Finance page open: unsaved changes in that tab are separate.</p>
<button id="download">Download encrypted recovery backup</button><p id="status" role="status"></p><h2>Storage sizes</h2><p id="summary"></p><table><thead><tr><th>Saved collection</th><th>Approximate size</th><th>Records</th></tr></thead><tbody id="sizes"></tbody></table>
<script src="./recovery.js"></script><script>
const report=FinanceRecovery.inspect(localStorage),size=n=>(n/1024).toFixed(1)+' KB';
document.getElementById('summary').textContent='Total browser local storage: '+size(report.total)+'. Other app data and settings: '+size(report.other)+'. Sizes are UTF-16 estimates, not a browser quota measurement.';
for(const row of report.rows){const tr=document.createElement('tr');for(const value of [row.key,size(row.bytes),row.count===null?'—':row.count+' ('+row.bankRows+' bank, '+row.duplicateIds+' repeated IDs)']){const td=document.createElement('td');td.textContent=value;tr.append(td);}document.getElementById('sizes').append(tr);}
document.getElementById('download').onclick=async()=>{const status=document.getElementById('status');try{status.textContent='Preparing encrypted backup…';const payload=FinanceRecovery.snapshot(localStorage);payload.archivedRecordVersions=await FinanceRecovery.readVersions(window.indexedDB);const content=await FinanceRecovery.encrypt(payload,localStorage.getItem('hub_key'),crypto),url=URL.createObjectURL(new Blob([content],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='finance-emergency-recovery-'+new Date().toISOString().slice(0,10)+'.enc.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='Encrypted backup download started. Check that the file is saved before refreshing your original Finance page.';}catch(error){status.textContent=error.message;}};
</script></html>
